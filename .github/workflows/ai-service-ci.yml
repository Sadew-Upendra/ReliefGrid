name: AI Service CI

on:
  push:
    branches: [main]
    paths: ["ai-service/**", ".github/workflows/ai-service-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["ai-service/**", ".github/workflows/ai-service-ci.yml"]

defaults:
  run:
    working-directory: ai-service

concurrency:
  group: ai-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Train and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Train model (sanity check the pipeline builds)
        run: python -m app.ml.train
        env:
          PYTHONPATH: .

      - name: Run tests
        run: pytest -v
        env:
          PYTHONPATH: .
