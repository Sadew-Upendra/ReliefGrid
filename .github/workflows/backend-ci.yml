name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: reliefgrid
          POSTGRES_USER: reliefgrid
          POSTGRES_PASSWORD: reliefgrid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reliefgrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/reliefgrid
          DB_USER: reliefgrid
          DB_PASSWORD: reliefgrid
          JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret
        run: mvn -B verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports

  dependency-check:
    name: OWASP dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # NVD_API_KEY (free, from nvd.nist.gov) makes this step minutes instead of hours,
      # and lets it fail the build reliably. Add it under repo Settings > Secrets > Actions.
      # Without the key the step still runs but is best-effort (continue-on-error).
      - name: Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: ${{ secrets.NVD_API_KEY == '' }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DnvdApiKey="${{ env.NVD_API_KEY }}"

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html
