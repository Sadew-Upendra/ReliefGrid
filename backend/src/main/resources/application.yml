spring:
  application:
    name: reliefgrid-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reliefgrid}
    username: ${DB_USER:reliefgrid}
    password: ${DB_PASSWORD:reliefgrid}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: reliefgrid-backend
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.reliefgrid.common.events
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.reliefgrid.common.events.RequestEvents$AiClassificationResult
server:
  port: 8080
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    livenessState:
      enabled: true
    readinessState:
      enabled: true
spring.mail:
  # Left blank by default: NotificationService logs instead of sending when host is blank
  # (see its "[DEV: no SMTP configured]" log line) — safe for local dev and CI out of the box.
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

app:
  notifications:
    from-address: ${NOTIFICATIONS_FROM_ADDRESS:no-reply@reliefgrid.local}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-32-bytes-min}
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
