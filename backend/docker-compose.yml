services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: reliefgrid
      POSTGRES_USER: reliefgrid
      POSTGRES_PASSWORD: reliefgrid
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliefgrid"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
