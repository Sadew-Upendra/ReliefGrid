# Local Prometheus + Grafana, wired to the backend already running via
# infra/docker/docker-compose.yml. Run:
#   docker compose -f infra/docker/docker-compose.yml -f infra/grafana/docker-compose.monitoring.yml up -d
name: reliefgrid

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [reliefgrid]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
    networks: [reliefgrid]

networks:
  reliefgrid:
    external: true
