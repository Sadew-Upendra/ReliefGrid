apiVersion: v1
kind: Secret
metadata:
  name: reliefgrid-secrets
  namespace: reliefgrid
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://CHANGE-ME:5432/reliefgrid"
  DB_USER: "CHANGE-ME"
  DB_PASSWORD: "CHANGE-ME"
  JWT_SECRET: "CHANGE-ME-32-BYTES-MINIMUM"
  BOOTSTRAP_ADMIN_EMAIL: ""
  BOOTSTRAP_ADMIN_PASSWORD: ""
  # Plaintext bootstrap-servers works as shown only against infra/kafka's local broker.
  # Against MSK Serverless (IAM-authenticated), the backend additionally needs the
  # aws-msk-iam-auth library and SASL properties — see docs/kafka.md "Production (MSK)".
  KAFKA_BOOTSTRAP_SERVERS: "CHANGE-ME:9098"
