apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: reliefgrid
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: ghcr.io/OWNER/reliefgrid-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: reliefgrid-config
            - secretRef:
                name: reliefgrid-secrets
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: 1, memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # JVM needs to write to /tmp
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: reliefgrid
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
