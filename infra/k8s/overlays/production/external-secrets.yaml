# Requires the External Secrets Operator installed cluster-wide (helm — see infra/k8s/README.md
# "Installing cluster add-ons"). Replaces the manual "kubectl create secret" from Step 9:
# this ServiceAccount, SecretStore, and ExternalSecret together sync AWS Secrets Manager
# into a real "reliefgrid-secrets" k8s Secret automatically, and keep it in sync on refreshInterval.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: reliefgrid
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_terraform_output_external_secrets_role_arn"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: reliefgrid
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: reliefgrid-secrets
  namespace: reliefgrid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: reliefgrid-secrets
    creationPolicy: Owner
    template:
      data:
        DB_URL: "jdbc:postgresql://{{ .dbHost }}:{{ .dbPort }}/reliefgrid"
        DB_USER: "{{ .dbUser }}"
        DB_PASSWORD: "{{ .dbPassword }}"
        JWT_SECRET: "{{ .jwtSecret }}"
        KAFKA_BOOTSTRAP_SERVERS: "{{ .kafkaBootstrap }}"
        BOOTSTRAP_ADMIN_EMAIL: "{{ .bootstrapEmail }}"
        BOOTSTRAP_ADMIN_PASSWORD: "{{ .bootstrapPassword }}"
  data:
    - secretKey: dbHost
      remoteRef: { key: reliefgrid-production-db-credentials, property: host }
    - secretKey: dbPort
      remoteRef: { key: reliefgrid-production-db-credentials, property: port }
    - secretKey: dbUser
      remoteRef: { key: reliefgrid-production-db-credentials, property: username }
    - secretKey: dbPassword
      remoteRef: { key: reliefgrid-production-db-credentials, property: password }
    - secretKey: jwtSecret
      remoteRef: { key: reliefgrid-production-app-secrets, property: jwt_secret }
    - secretKey: kafkaBootstrap
      remoteRef: { key: reliefgrid-production-app-secrets, property: kafka_bootstrap_servers }
    - secretKey: bootstrapEmail
      remoteRef: { key: reliefgrid-production-app-secrets, property: bootstrap_admin_email }
    - secretKey: bootstrapPassword
      remoteRef: { key: reliefgrid-production-app-secrets, property: bootstrap_admin_password }
