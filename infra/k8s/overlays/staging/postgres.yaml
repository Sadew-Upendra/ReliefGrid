apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: reliefgrid
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:17-3.5
          ports: [{ containerPort: 5432 }]
          envFrom:
            - secretRef: { name: reliefgrid-secrets }
          env:
            - { name: POSTGRES_DB, value: reliefgrid }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: reliefgrid-secrets, key: DB_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: reliefgrid-secrets, key: DB_PASSWORD } } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: reliefgrid
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432 }]
