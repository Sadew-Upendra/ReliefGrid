# Staging runs light: one replica each, smaller requests. Applied over the base Deployments.
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: reliefgrid }
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: reliefgrid }
spec:
  replicas: 1
