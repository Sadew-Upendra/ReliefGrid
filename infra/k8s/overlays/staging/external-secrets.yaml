# Requires the External Secrets Operator installed cluster-wide (helm — see infra/k8s/README.md
# "Installing cluster add-ons"). Syncs AWS Secrets Manager into the real "reliefgrid-secrets"
# k8s Secret automatically, replacing the manual "kubectl create secret" from Step 9.
#
# Staging has no RDS (see infra/terraform/environments/staging/main.tf): DB_USER/DB_PASSWORD
# still come from AWS Secrets Manager so they're generated once and not hand-typed, but DB_URL
# points at the in-cluster Postgres Service from ./postgres.yaml, not at AWS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: reliefgrid
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_terraform_output_external_secrets_role_arn"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: reliefgrid
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: reliefgrid-secrets
  namespace: reliefgrid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: reliefgrid-secrets
    creationPolicy: Owner
    template:
      data:
        DB_URL: "jdbc:postgresql://postgres.reliefgrid.svc.cluster.local:5432/reliefgrid"
        DB_USER: "{{ .dbUser }}"
        DB_PASSWORD: "{{ .dbPassword }}"
        JWT_SECRET: "{{ .jwtSecret }}"
        KAFKA_BOOTSTRAP_SERVERS: "{{ .kafkaBootstrap }}"
        BOOTSTRAP_ADMIN_EMAIL: "{{ .bootstrapEmail }}"
        BOOTSTRAP_ADMIN_PASSWORD: "{{ .bootstrapPassword }}"
  data:
    - secretKey: dbUser
      remoteRef: { key: reliefgrid-staging-app-secrets, property: db_user }
    - secretKey: dbPassword
      remoteRef: { key: reliefgrid-staging-app-secrets, property: db_password }
    - secretKey: jwtSecret
      remoteRef: { key: reliefgrid-staging-app-secrets, property: jwt_secret }
    - secretKey: kafkaBootstrap
      remoteRef: { key: reliefgrid-staging-app-secrets, property: kafka_bootstrap_servers }
    - secretKey: bootstrapEmail
      remoteRef: { key: reliefgrid-staging-app-secrets, property: bootstrap_admin_email }
    - secretKey: bootstrapPassword
      remoteRef: { key: reliefgrid-staging-app-secrets, property: bootstrap_admin_password }
